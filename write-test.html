<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Momo Math · Writing test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F1EA;--card:#FFFCF7;--edge:#E6D5C4;--ink:#5A3E33;--ink2:#7A5A4A;--display:'Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#app{min-height:100%;display:flex;flex-direction:column;gap:14px;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));max-width:1100px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar h1{margin:0;font-size:22px}
.link{background:var(--card);border:4px solid var(--edge);border-radius:999px;padding:8px 16px;font-weight:800;text-decoration:none;color:var(--ink);box-shadow:0 4px 0 var(--edge)}
.main{display:flex;gap:24px;flex:1;min-height:0}
.play{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.host{display:flex;align-items:center;gap:14px}
.host img{height:clamp(80px,14dvh,130px);width:auto}
.bubble{background:var(--card);border:4px solid var(--edge);border-radius:24px;padding:10px 20px;font-family:var(--display);font-weight:800;font-size:clamp(22px,3.4dvh,30px);display:flex;align-items:center;gap:12px}
.bubble .target{font-size:1.8em;line-height:1;color:#3B78A0}
.pads{display:flex;gap:16px;justify-content:center}
.pad{position:relative;width:min(42vw,300px,38dvh);aspect-ratio:3/4;background:#FFFFFF;border:4px solid var(--edge);border-radius:28px;touch-action:none;overflow:hidden;box-shadow:0 6px 0 var(--edge)}
.pads.two .pad{width:min(40vw,240px,32dvh)}
.pad::before{content:'';position:absolute;left:12%;right:12%;top:50%;border-top:3px dashed #EFE3D6}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{min-height:56px;padding:0 26px;border-radius:22px;border:4px solid #8DB6D0;background:#A7D0E8;box-shadow:0 6px 0 #6EA6D1;font-family:var(--display);font-weight:800;font-size:24px;color:#1F3B52}
.btn.plain{background:var(--card);border-color:var(--edge);box-shadow:0 6px 0 var(--edge);color:var(--ink)}
.btn:active{transform:translateY(3px)}
.result{min-height:64px;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(20px,3dvh,28px)}
.result .read{font-size:1.6em;color:#4F7A3B}
.result.bad .read{color:#B5604A}
.result .alts{display:block;font-family:Nunito,sans-serif;font-size:15px;color:var(--ink2);font-weight:700}
.side{width:300px;flex:none;background:var(--card);border:4px solid var(--edge);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;align-self:flex-start}
.side h2{margin:0;font-size:18px}
.side .big{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.digits{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.digits div{border-radius:10px;background:#F4ECE2;text-align:center;padding:4px 0;font-weight:800;font-size:14px}
.digits div b{display:block;font-family:var(--display);font-size:20px}
.seg{display:flex;gap:4px;padding:4px;border:4px solid var(--edge);border-radius:999px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;min-height:36px;font-weight:800;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.small{font-size:13px;color:var(--ink2);margin:0;line-height:1.4}
.judge{display:none;gap:10px;justify-content:center}
.judge.on{display:flex}
.judge button{min-height:44px;padding:0 18px;border-radius:999px;border:4px solid var(--edge);background:var(--card);font-weight:800}
@media (max-width:800px){ .main{flex-direction:column} .side{width:100%} }
</style>
<!-- Vercel Web Analytics (the plain-HTML version of @vercel/analytics) -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div id="app">
  <div class="bar"><h1>Writing test</h1><a class="link" href="./">Back to Momo Math</a></div>
  <div class="main">
    <div class="play">
      <div class="host"><img src="animals/hedgehog.png" alt="Hedgehog"><div class="bubble"><span id="ask">Write</span><span class="target" id="target">7</span></div></div>
      <div class="pads" id="pads"></div>
      <div class="row"><button class="btn plain" id="clear">Clear</button><button class="btn" id="done">Done</button></div>
      <div class="result" id="result"></div>
      <div class="judge" id="judge"><span class="small" style="align-self:center">Was I right?</span><button id="yes">Yes</button><button id="no">No</button></div>
    </div>
    <div class="side">
      <h2>How well can I read?</h2>
      <div><span class="big" id="acc">–</span> <span class="small" id="accN">right so far</span></div>
      <div class="digits" id="perDigit"></div>
      <h2>Numbers to ask</h2>
      <div class="seg" id="mode"><button data-m="1" aria-pressed="true">0–9</button><button data-m="2" aria-pressed="false">10–20</button></div>
      <h2>Learn her writing</h2>
      <div class="seg" id="learn"><button data-l="1" aria-pressed="true">On</button><button data-l="0" aria-pressed="false">Off</button></div>
      <p class="small" id="samples"></p>
      <p class="small">Each digit she writes is kept on this device and used to read her next ones better. Turn it off to see how the built-in reader does alone.</p>
      <button class="btn plain" id="reset" style="font-size:16px;min-height:44px">Clear results and samples</button>
    </div>
  </div>
</div>
<script src="digits-model.js"></script>
<script>
(function(){
'use strict';
/* ---------- model ---------- */
var M = window.DIGIT_MODEL;
function dec(b64){ var s = atob(b64), a = new Int8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = (s.charCodeAt(i) << 24) >> 24; return a; }
var H = M.h, W1 = dec(M.w1), W2 = dec(M.w2);
function mlp(x){
  var h = new Float32Array(H), i, j;
  for (j = 0; j < H; j++) h[j] = M.b1[j];
  for (i = 0; i < 784; i++) { var v = x[i]; if (!v) continue; var row = i * H; for (j = 0; j < H; j++) h[j] += v * W1[row + j] * M.s1; }
  var o = M.b2.slice();
  for (j = 0; j < H; j++) { var hv = h[j] > 0 ? h[j] : 0; if (!hv) continue; for (var k = 0; k < 10; k++) o[k] += hv * W2[j * 10 + k] * M.s2; }
  return softmax(o);
}
function softmax(o){ var m = Math.max.apply(null, o), e = o.map(function(v){ return Math.exp(v - m); }), s = e.reduce(function(a, b){ return a + b; }, 0); return e.map(function(v){ return v / s; }); }

/* ---------- drawing -> 28x28 (same steps as training: bbox into 20px box, centred, 2.3px lines, 4x antialias) ---------- */
var off = document.createElement('canvas'); off.width = off.height = 112; var octx = off.getContext('2d');
function toVec(strokes){
  var pts = [].concat.apply([], strokes); if (pts.length < 2) return null;
  var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  pts.forEach(function(p){ x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); });
  var w = Math.max(x1 - x0, 1e-6), h = Math.max(y1 - y0, 1e-6);
  if (Math.max(w, h) < 12) return null;                       /* just a dot */
  var sc = 20 / Math.max(w, h), ox = (28 - w * sc) / 2 - x0 * sc, oy = (28 - h * sc) / 2 - y0 * sc, S = 4;
  octx.fillStyle = '#000'; octx.fillRect(0, 0, 112, 112);
  octx.strokeStyle = '#fff'; octx.fillStyle = '#fff'; octx.lineWidth = Math.round(2.3 * S); octx.lineCap = 'round'; octx.lineJoin = 'round';
  strokes.forEach(function(s){
    octx.beginPath();
    s.forEach(function(p, i){ var X = (p[0] * sc + ox) * S, Y = (p[1] * sc + oy) * S; if (i) octx.lineTo(X, Y); else octx.moveTo(X, Y); });
    if (s.length === 1) octx.lineTo((s[0][0] * sc + ox) * S + .1, (s[0][1] * sc + oy) * S);
    octx.stroke();
  });
  var d = octx.getImageData(0, 0, 112, 112).data, v = new Float32Array(784);
  for (var y = 0; y < 28; y++) for (var x = 0; x < 28; x++) {
    var sum = 0;
    for (var dy = 0; dy < 4; dy++) for (var dx = 0; dx < 4; dx++) sum += d[((y * 4 + dy) * 112 + x * 4 + dx) * 4];
    v[y * 28 + x] = sum / 16 / 255;
  }
  return v;
}

/* ---------- her own samples: nearest neighbours ---------- */
var KEY = 'momo-write-test-v1';
var D = load();
function load(){ try { return JSON.parse(localStorage.getItem(KEY)) || { tries:[], samples:[], learn:true, mode:1 }; } catch(e) { return { tries:[], samples:[], learn:true, mode:1 }; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(D)); } catch(e) {} }
function pack(v){ var s = ''; for (var i = 0; i < 784; i++) s += String.fromCharCode(Math.round(v[i] * 255)); return btoa(s); }
function unpack(b){ var s = atob(b), v = new Float32Array(784); for (var i = 0; i < 784; i++) v[i] = s.charCodeAt(i) / 255; return v; }
var cache = [];
function refreshCache(){ cache = D.samples.map(function(s){ return { y:s.y, v:unpack(s.v) }; }); }
refreshCache();
function knn(v){
  if (cache.length < 10) return null;
  var best = new Array(10).fill(Infinity);
  cache.forEach(function(s){ var d = 0; for (var i = 0; i < 784; i++) { var t = v[i] - s.v[i]; d += t * t; } if (d < best[s.y]) best[s.y] = d; });
  var tau = 12, o = best.map(function(d){ return isFinite(d) ? -d / tau : -1e9; });
  return softmax(o);
}
function classify(v){
  var p = mlp(v), k = D.learn ? knn(v) : null;
  if (k) p = p.map(function(x, i){ return 0.55 * x + 0.45 * k[i]; });
  var order = p.map(function(x, i){ return [x, i]; }).sort(function(a, b){ return b[0] - a[0]; });
  return { digit:order[0][1], conf:order[0][0], alts:order.slice(1, 3) };
}

/* ---------- pads ---------- */
var pads = [];
function makePads(n){
  var box = document.getElementById('pads'); box.innerHTML = ''; box.className = 'pads' + (n === 2 ? ' two' : ''); pads = [];
  for (var i = 0; i < n; i++) {
    var el = document.createElement('div'); el.className = 'pad'; var c = document.createElement('canvas'); el.appendChild(c); box.appendChild(el);
    pads.push(pad(el, c));
  }
}
function pad(el, c){
  var P = { strokes:[], cur:null, el:el, c:c, ctx:c.getContext('2d') };
  function size(){ var r = el.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; c.width = r.width * dpr; c.height = r.height * dpr; P.ctx.setTransform(dpr, 0, 0, dpr, 0, 0); redraw(); }
  function pt(e){ var r = c.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
  function redraw(){
    var x = P.ctx, r = el.getBoundingClientRect(); x.clearRect(0, 0, r.width, r.height);
    x.strokeStyle = '#5A3E33'; x.lineWidth = Math.max(8, r.width * 0.045); x.lineCap = 'round'; x.lineJoin = 'round';
    P.strokes.forEach(function(s){ x.beginPath(); s.forEach(function(p, i){ if (i) x.lineTo(p[0], p[1]); else x.moveTo(p[0], p[1]); }); if (s.length === 1) x.lineTo(s[0][0] + .1, s[0][1]); x.stroke(); });
  }
  c.addEventListener('pointerdown', function(e){ e.preventDefault(); try { c.setPointerCapture(e.pointerId); } catch(_) {} P.cur = [pt(e)]; P.strokes.push(P.cur); redraw(); clearResult(); });
  c.addEventListener('pointermove', function(e){ if (!P.cur) return; var q = pt(e), l = P.cur[P.cur.length - 1]; if (Math.abs(q[0] - l[0]) + Math.abs(q[1] - l[1]) < 2) return; P.cur.push(q); redraw(); });
  function up(){ P.cur = null; }
  c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
  P.clear = function(){ P.strokes = []; redraw(); };
  P.size = size;
  requestAnimationFrame(size);
  return P;
}
window.addEventListener('resize', function(){ pads.forEach(function(p){ p.size(); }); });

/* ---------- test flow ---------- */
var target = 0, last = null;
function newTarget(){
  var t; do { t = D.mode === 2 ? 10 + Math.floor(Math.random() * 11) : Math.floor(Math.random() * 10); } while (t === target);
  target = t; document.getElementById('target').textContent = t;
  makePads(t >= 10 ? 2 : 1); clearResult(); last = null;
  speak(t);
}
function speak(t){ try { speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance('Write ' + t + '!'); u.lang = 'en-US'; u.rate = 0.9; speechSynthesis.speak(u); } catch(e) {} }
function clearResult(){ var r = document.getElementById('result'); r.innerHTML = ''; r.className = 'result'; document.getElementById('judge').classList.remove('on'); }
document.getElementById('clear').onclick = function(){ pads.forEach(function(p){ p.clear(); }); clearResult(); };
document.getElementById('done').onclick = function(){
  var digits = String(target).split('').map(Number), res = [], vecs = [];
  for (var i = 0; i < pads.length; i++) { var v = toVec(pads[i].strokes); if (!v) { show('Write the number first!'); return; } vecs.push(v); res.push(classify(v)); }
  var read = res.map(function(r){ return r.digit; }).join(''), conf = Math.min.apply(null, res.map(function(r){ return r.conf; }));
  var ok = +read === target;
  last = { vecs:vecs, digits:digits, read:read, ok:ok };
  var r = document.getElementById('result');
  r.className = 'result' + (ok ? '' : ' bad');
  r.innerHTML = (conf < 0.6 ? 'Did you write ' : 'I read ') + '<span class="read">' + read + '</span>' + (conf < 0.6 ? '?' : '') +
    '<span class="alts">sure: ' + Math.round(conf * 100) + '%' + (res.length === 1 ? ' · next guesses: ' + res[0].alts.map(function(a){ return a[1] + ' (' + Math.round(a[0] * 100) + '%)'; }).join(', ') : '') + '</span>';
  document.getElementById('judge').classList.add('on');
};
function show(t){ var r = document.getElementById('result'); r.className = 'result bad'; r.textContent = t; }
function judge(right){
  if (!last) return;
  /* the grown-up's call counts: "Yes" = I read what she wrote (even if she wrote another number than asked),
     "No" = I misread it, so it was the number she was asked for */
  D.tries.push({ t:target, read:last.read, ok:right ? 1 : 0 });
  var labels = right ? last.read.split('').map(Number) : last.digits;
  if (labels.length === last.vecs.length) last.vecs.forEach(function(v, i){ D.samples.push({ y:labels[i], v:pack(v) }); });
  if (D.samples.length > 400) D.samples = D.samples.slice(-400);
  save(); refreshCache(); stats(); newTarget();
}
document.getElementById('yes').onclick = function(){ judge(true); };
document.getElementById('no').onclick = function(){ judge(false); };
function stats(){
  var n = D.tries.length, ok = D.tries.filter(function(t){ return t.ok; }).length;
  document.getElementById('acc').textContent = n ? Math.round(ok / n * 100) + '%' : '–';
  document.getElementById('accN').textContent = n ? ok + ' of ' + n + ' read right' : 'right so far';
  var per = '';
  for (var d = 0; d < 10; d++) {
    var tt = D.tries.filter(function(t){ return t.t < 10 ? t.t === d : String(t.t).indexOf(String(d)) >= 0; }), k = tt.filter(function(t){ return t.ok; }).length;
    per += '<div><b>' + d + '</b>' + (tt.length ? k + '/' + tt.length : '–') + '</div>';
  }
  document.getElementById('perDigit').innerHTML = per;
  document.getElementById('samples').textContent = D.samples.length + ' of her digits saved' + (D.samples.length < 10 ? ' (learning starts at 10)' : '');
}
function segs(){
  document.querySelectorAll('#mode button').forEach(function(b){ b.setAttribute('aria-pressed', String(+b.dataset.m === D.mode)); });
  document.querySelectorAll('#learn button').forEach(function(b){ b.setAttribute('aria-pressed', String(!!+b.dataset.l === D.learn)); });
}
document.getElementById('mode').onclick = function(e){ var b = e.target.closest('button'); if (!b) return; D.mode = +b.dataset.m; save(); segs(); newTarget(); };
document.getElementById('learn').onclick = function(e){ var b = e.target.closest('button'); if (!b) return; D.learn = !!+b.dataset.l; save(); segs(); };
document.getElementById('reset').onclick = function(){ if (!confirmArm(this)) return; D = { tries:[], samples:[], learn:D.learn, mode:D.mode }; save(); refreshCache(); stats(); };
function confirmArm(b){ if (b.dataset.armed) { delete b.dataset.armed; b.textContent = 'Clear results and samples'; return true; } b.dataset.armed = 1; b.textContent = 'Tap again to clear'; return false; }
segs(); stats(); newTarget();
window.__wt = { toVec:toVec, mlp:mlp, classify:classify };
})();
</script>
</body>
</html>
