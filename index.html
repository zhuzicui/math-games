<style>
:root{
  --paper:#F7F1EA; --card:#FFFCF7; --edge:#E6D5C4; --ink:#5A3E33; --ink2:#7A5A4A; --line:#6B4A3A;
  --coral:#E9917A; --coral-d:#C46F58; --sage:#A9C99F; --sage-d:#7FA474; --butter:#F7D98C; --peach:#F6C9B4;
  --sky:#B9D3E3; --lilac:#E6DDEF; --mint:#D5ECE4;
  /* plate = cookies already there (red), jar = cookies added (blue) */
  --red-ink:#B5604A; --red-bg:#FCE8E2; --red-ring:#F8D6CC; --red-edge:#E2A898;
  --blue-ink:#3B78A0; --blue-bg:#E2EEF6; --blue-edge:#8DB6D0; --blue-slot:#A6C6DA;
  --ck: clamp(42px, 12.5vw, 70px);
  --display: 'Baloo 2', 'Arial Rounded MT Bold', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Nunito,'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',system-ui,sans-serif;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.screen{flex:1;display:flex;flex-direction:column;gap:clamp(6px,1.6dvh,12px);width:100%;max-width:1100px;margin:0 auto;min-height:0}
.sr{position:absolute;top:0;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shared bits */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.round{width:60px;height:60px;border-radius:50%;border:4px solid var(--edge);background:var(--card);box-shadow:0 5px 0 var(--edge);display:flex;align-items:center;justify-content:center;flex:none}
.round:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.round svg{width:30px;height:30px}
.small-round{width:48px;height:48px;border-radius:50%;border:4px solid var(--edge);background:transparent;display:flex;align-items:center;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:4px solid var(--edge);border-radius:24px;padding:6px 16px;box-shadow:0 5px 0 var(--edge);font-family:var(--display);font-weight:800;font-size:24px}
.chip svg{width:28px;height:28px}
.big-btn{border:4px solid var(--coral-d);border-radius:24px;min-height:76px;padding:0 34px;font-family:var(--display);font-weight:800;font-size:30px;background:var(--coral);box-shadow:0 7px 0 var(--coral-d);color:#3E2A22}
.big-btn.green{background:var(--sage);border-color:var(--sage-d);box-shadow:0 7px 0 var(--sage-d)}
.big-btn.plain{background:var(--card);box-shadow:0 7px 0 var(--edge);border-color:var(--edge);color:var(--ink)}
.big-btn:active{transform:translateY(4px);box-shadow:0 3px 0 var(--coral-d)}
.big-btn.green:active{box-shadow:0 3px 0 var(--sage-d)}
h1,h2{font-family:var(--display);font-weight:800;margin:0;line-height:1.05}

/* home */
.hero{display:flex;align-items:center;gap:14px}
.hero .momo{width:clamp(96px,26vw,140px);flex:none}
.hero h1{font-size:clamp(32px,9vw,56px)}
.hero p{margin:4px 0 0;font-size:clamp(17px,4.5vw,22px);color:var(--ink2);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tile{border:4px solid;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px 8px;font-family:var(--display);font-weight:800;font-size:clamp(20px,5.5vw,28px);text-align:center;line-height:1.1}
.tile:active{transform:translateY(4px)}
.tile .pic{width:clamp(86px,26vw,130px)}
.tile.feed{background:#F9DCCB;border-color:#EDC3AC;box-shadow:0 7px 0 #EDC3AC}
.chip-btn{cursor:pointer;color:var(--ink);min-height:44px}
.chip-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.tiles.one{grid-template-columns:minmax(0,1fr)}
.tile.garden{background:#DAECEC;border-color:#B3D5D7;box-shadow:0 7px 0 #B3D5D7}
.soon-title{font-family:var(--display);font-weight:800;font-size:20px;color:var(--ink2);margin:8px 0 -2px}
.soon{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.soon button{border:4px dashed #D9C4AF;background:#FBF6EF;border-radius:24px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:800;color:var(--ink2)}
.soon .pic{width:auto;height:58px;opacity:.8;filter:saturate(.7)}
.momo{height:auto;-webkit-user-drag:none}
.animal{height:auto;object-fit:contain;-webkit-user-drag:none}

/* play */
.dots{display:flex;gap:8px}
.dots span{width:20px;height:20px;border-radius:50%;border:4px solid #D9C4AF;background:var(--card)}
.dots span.done{background:var(--sage);border-color:var(--line)}
.dots span.now{background:var(--coral);border-color:var(--line);box-shadow:0 0 0 4px #F6D0C8}
.stage{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.momo-row{display:flex;align-items:center;justify-content:center;gap:10px}
.momo-row .momo{width:clamp(104px,30vw,150px);flex:none}
.bubble{position:relative;background:var(--card);border:4px solid var(--edge);border-radius:24px;padding:10px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:60%}
.bubble b{position:relative;z-index:1;font-family:var(--display);font-weight:800;font-size:clamp(24px,7vw,36px);line-height:1.05;text-align:center}
.left{display:flex;flex-direction:column;gap:8px}
.center{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.plate{flex:1;min-height:150px;background:var(--red-bg);border:4px solid var(--red-edge);box-shadow:inset 0 0 0 12px var(--red-ring);border-radius:24px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:12px;padding:24px 20px;transition:background .2s}
.plate.hot{background:#F9D9CF}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-weight:800;font-size:clamp(40px,12vw,64px);line-height:1}
.eq .s{color:var(--red-ink)}.eq .a{color:var(--blue-ink);min-width:.7em;text-align:center}
.eq .t{background:var(--card);border:4px solid var(--edge);border-radius:24px;padding:2px 14px;min-width:1.4em;text-align:center}
.bottom{display:flex;gap:10px;align-items:stretch}
.jar{flex:1;background:var(--blue-bg);border:4px solid var(--blue-edge);border-radius:24px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:8px;padding:10px;min-height:calc(var(--ck) + 24px)}
.slot{display:block;width:var(--ck);height:var(--ck);border-radius:50%;border:4px dashed var(--blue-slot);flex:none}
.donebtn{width:clamp(100px,26vw,150px);border:4px solid var(--sage-d);border-radius:24px;background:var(--sage);box-shadow:0 6px 0 var(--sage-d);font-family:var(--display);font-weight:800;font-size:clamp(24px,6.5vw,32px);color:#2F2019}
.donebtn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--sage-d)}
.donebtn:disabled{opacity:.55}

.cookie{display:block;width:var(--ck);height:var(--ck);border-radius:50%;border:4px solid var(--edge-c);padding:0;flex:none;position:relative;
  --dough:#A7D0E8; --edge-c:#3B78A0; --chip:#2A5F82;                 /* blue = cookies you add */
  background:
    radial-gradient(circle at 35% 32%, var(--chip) 0 8%, transparent 9%),
    radial-gradient(circle at 69% 44%, var(--chip) 0 8%, transparent 9%),
    radial-gradient(circle at 45% 70%, var(--chip) 0 8%, transparent 9%),
    var(--dough);}
.cookie.start{--dough:#F4AE9F; --edge-c:#B5604A; --chip:#8A3A2C}       /* red = already on the plate */
.cookie .x{position:absolute;top:-4px;right:-4px;width:clamp(15px,calc(var(--ck) * .34),19px);height:clamp(15px,calc(var(--ck) * .34),19px);border-radius:50%;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(107,74,58,.25)}
.cookie .x svg{width:60%;height:60%;stroke:#5A3E33;stroke-width:2;stroke-linecap:round;fill:none}
.jar .cookie,#plate button.cookie{touch-action:none;cursor:grab}
.jar.hot{background:#CFE2EF}
.cookie.pop{animation:pop .35s ease-out}
.cookie.counted{box-shadow:0 0 0 5px var(--butter);background:var(--dough)}   /* chips hidden so the number reads clearly */
.cookie .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:calc(var(--ck) * .5);color:#3E2A22}
.cookie.munch{animation:munch .45s ease-in forwards}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);box-shadow:0 10px 20px rgba(90,62,51,.25)}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes munch{to{transform:scale(0) rotate(90deg);opacity:0}}
.momo.bounce{animation:bounce .6s ease-in-out 2}
@keyframes bounce{50%{transform:translateY(-14px) scale(1.04)}}
.momo.wobble{animation:wobble .5s ease-in-out}
@keyframes wobble{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}

/* overlays */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(243,238,226,.97);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.reward{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;width:100%;max-width:640px}
.reward h1{font-size:clamp(44px,13vw,80px)}
.reward .momo{width:clamp(130px,38vw,220px)}
.sumcard{background:var(--card);border:4px solid var(--edge);border-radius:24px;padding:16px 20px;box-shadow:0 7px 0 var(--edge);display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.groups{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-family:var(--display);font-weight:800;font-size:34px}
.groups .g{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:220px}
.groups .cookie{--ck:30px}
.bigeq{font-family:var(--display);font-weight:800;font-size:clamp(52px,15vw,88px);line-height:1;display:flex;gap:12px}
.bigeq .s{color:var(--red-ink)}.bigeq .a{color:var(--blue-ink)}.bigeq .t{color:var(--ink)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:41;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:14px;height:14px;border:2px solid var(--line);border-radius:4px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

/* garden */
.garden-head{text-align:center}
.garden-head h1{font-size:clamp(34px,9vw,52px)}
.goal{align-self:center;background:var(--card);border:4px solid var(--edge);border-radius:24px;padding:8px 18px;font-weight:800;font-size:clamp(16px,4.4vw,20px);text-align:center}
.ground{flex:1;background:#CFE3C4;border-top:4px solid #8FB383;border-radius:24px 24px 0 0;padding:30px 12px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px 6px;align-content:start;margin:0 -14px -12px;overflow-y:auto}
.plot{display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.plot svg{width:60px;height:66px}
.plot .soil{width:56px;height:12px;border-radius:50%;background:#B9906E;border:4px solid var(--line);margin-top:-5px}
.plot.sun svg{width:66px;height:80px}
.empty-garden{grid-column:1/-1;text-align:center;font-weight:800;font-size:20px;padding:30px 10px}

/* parents */
.parents{font-family:Nunito,system-ui,sans-serif}
.parents h1{font-size:30px}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:4px solid var(--edge);border-radius:24px;padding:14px 16px}
.card .k{font-size:14px;font-weight:700;color:var(--ink2)}
.card .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1}
.card h2{font-size:20px;margin-bottom:8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:10px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.facts{display:grid;gap:4px}
.facts div{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:clamp(10px,2.8vw,16px)}
.facts .h{color:var(--ink2);font-size:clamp(12px,3.2vw,18px)}
.f-got{background:#8DB582;color:#23301F}
.f-learn{background:var(--butter);color:#3E2A22}
.f-new{background:#F3E6D6;border:1px solid #D9C4AF;color:#6B4A3A}
.f-x{border:1px dashed #EADDCF}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:46px;border-radius:24px;border:4px solid var(--edge);background:var(--card);font-weight:800;font-size:16px}
.seg button[aria-pressed="true"]{background:#4F7A47;border-color:#4F7A47;color:#fff}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field label,.field .lab{font-weight:800;font-size:15px}
.field input{font:inherit;font-size:17px;padding:10px 14px;border-radius:24px;border:4px solid var(--edge);background:#fff;color:var(--ink);user-select:text;-webkit-user-select:text}
.link-btn{min-height:44px;background:none;border:none;color:#9E4A35;font-weight:800;font-size:15px;padding:10px 0;text-decoration:underline}
.tip{font-size:16px;line-height:1.5;margin:0;color:#4F382E}

/* gate */
.gate{background:var(--card);border:4px solid var(--edge);border-radius:24px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center}
.gate h2{font-size:26px}
.gate p{margin:0;font-size:18px;font-weight:700}
.gate .opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gate .opts button{min-height:56px;border-radius:24px;border:4px solid var(--edge);background:#fff;font-weight:800;font-size:22px}

/* start */
.startscreen{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.startscreen .momo{width:clamp(150px,44vw,240px)}
.startbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:10px}
.langpick{max-width:330px;flex:0 1 auto}
.langpick button{min-height:44px;font-size:15px;padding:0 6px}
.nameform{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%;max-width:420px}
.name-input{width:100%;font-family:var(--display);font-weight:700;font-size:clamp(28px,8vw,40px);text-align:center;padding:12px 18px;border-radius:24px;border:4px solid var(--edge);background:var(--card);color:var(--ink);user-select:text;-webkit-user-select:text;outline:none}
.name-input:focus{border-color:var(--coral)}
.startscreen h1{font-size:clamp(40px,11vw,68px)}


/* ===== fit-to-screen: everything sized by available height too ===== */
.round{width:clamp(44px,8dvh,60px);height:clamp(44px,8dvh,60px)}
.round svg{width:50%;height:50%}
.small-round{width:clamp(44px,7dvh,48px);height:clamp(44px,7dvh,48px)}
.chip{font-size:clamp(18px,3.4dvh,24px);padding:4px 14px}
.big-btn{min-height:clamp(50px,10dvh,76px);font-size:clamp(22px,4.6dvh,30px);padding:0 clamp(20px,4dvh,34px)}
/* start */
.startscreen{gap:clamp(6px,2dvh,16px)}
.startscreen .momo{width:auto;height:clamp(70px,26dvh,240px)}
.startscreen h1{font-size:clamp(28px,min(11vw,7dvh),68px)}
.nameform{gap:clamp(8px,2dvh,16px)}
.name-input{font-size:clamp(22px,min(8vw,5.5dvh),40px);padding:clamp(6px,1.4dvh,12px) 18px}
/* home */
.hero .momo{width:auto;height:clamp(60px,16dvh,150px)}
.hero h1{font-size:clamp(26px,min(9vw,6.5dvh),56px)}
.games{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1.6dvh,12px)}
.tiles{flex:1;min-height:0;grid-auto-rows:1fr}
.tile{min-height:0;padding:clamp(6px,1.6dvh,14px) 8px;font-size:clamp(18px,min(5.5vw,4dvh),28px)}
.tile .pic{width:auto;max-width:90%;height:clamp(50px,15dvh,140px);flex:none}
.soon-title{margin:0;font-size:clamp(16px,2.8dvh,20px)}
.soon-wrap{margin-top:clamp(18px,4dvh,36px)}
.soon .pic{height:clamp(30px,6.5dvh,64px)}
.soon button{padding:clamp(4px,1dvh,8px) 4px}
/* play */
:root{--ck:clamp(32px,min(12.5vw,8.6dvh),70px)}
.momo-row .momo{width:auto;height:clamp(60px,15dvh,170px)}
.bubble{padding:clamp(4px,1.2dvh,10px) 16px}
.bubble b{font-size:clamp(20px,min(7vw,4.6dvh),36px)}
.eq{font-size:clamp(28px,min(12vw,7dvh),64px)}
.plate{min-height:0;padding:clamp(12px,2.4dvh,24px) 16px;gap:clamp(6px,1.4dvh,12px)}
.jar{gap:clamp(5px,1dvh,8px);padding:clamp(5px,1dvh,10px)}
/* reward */
.reward{gap:clamp(8px,2dvh,16px);max-height:100%}
.reward h1{font-size:clamp(30px,min(13vw,8.5dvh),80px)}
.reward .momo,.reward .pic{width:auto;height:clamp(64px,22dvh,220px)}
.sumcard{padding:clamp(8px,2dvh,16px) 20px;gap:clamp(4px,1.2dvh,10px)}
.groups .cookie{--ck:clamp(16px,4.2dvh,30px)}
.groups{font-size:clamp(20px,4dvh,34px)}
.bigeq{font-size:clamp(34px,min(15vw,9.5dvh),88px)}
.reward .row.two{flex-wrap:nowrap}
.reward .row.two .big-btn{font-size:clamp(18px,min(5vw,4.4dvh),30px);padding:0 clamp(12px,3vw,30px)}
.reward .row .chip svg{width:clamp(20px,4dvh,28px);height:clamp(20px,4dvh,28px)}
.stars-row span{display:inline-block;width:clamp(24px,5dvh,44px)}
/* garden */
.garden-head h1{font-size:clamp(24px,min(9vw,6dvh),52px)}
.goal{padding:clamp(4px,1dvh,8px) 18px;font-size:clamp(14px,2.6dvh,20px)}

/* ===== iPad (both orientations): sketch layout =====

  .stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:clamp(10px,1.8dvh,18px) clamp(14px,2.4vw,24px);flex-direction:initial}

/* ===== star sky (replaces the garden) ===== */
body.skybg,body.skybg #app{background:#DAECEC}
.sky{flex:1;min-height:0;padding:clamp(4px,1dvh,12px) 0 clamp(8px,2dvh,24px);display:grid;grid-template-rows:minmax(0,1fr) auto;gap:clamp(8px,1.8dvh,18px);justify-items:center;align-items:center}
.rb{width:100%;height:100%;min-height:0;display:flex;align-items:flex-end;justify-content:center}
.rainbow{height:100%;max-width:100%;max-height:420px}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(6px,2vw,16px);width:100%;max-width:640px;padding:clamp(6px,1.4dvh,12px);border-radius:24px;border:4px solid var(--stripe);background:color-mix(in srgb, var(--stripe) 22%, transparent)}
.slot-star{display:flex;align-items:center;justify-content:center}
.kstar{width:clamp(40px,min(15vw,12dvh),110px);height:auto;-webkit-user-drag:none}
.kstar.empty{color:#8FBFC4;color:color-mix(in srgb, var(--stripe) 65%, #5A3E33);height:clamp(40px,min(15vw,12dvh),110px);padding:6%}
.slot-star.newest .kstar{animation:twinkle 1.6s ease-in-out .3s 2}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.18) rotate(-8deg)}60%{transform:scale(.96) rotate(6deg)}}
.shelf{width:100%;background:rgba(255,255,255,.55);border:4px solid #B3D5D7;border-radius:24px;padding:clamp(6px,1.2dvh,10px) 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.shelf-label{font-family:var(--display);font-weight:800;font-size:clamp(15px,2.6dvh,20px);color:#3E5A6E}
.shelf-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;flex:1;min-width:0}
.mini{width:clamp(34px,7dvh,56px);height:auto;flex:none}
.shelf .more{font-family:var(--display);font-weight:800;font-size:20px;color:#3E5A6E}
.shelf .none{font-size:15px;font-weight:700;color:#4E6A7E}
.rainbow-news{font-family:var(--display);font-size:clamp(18px,3.4dvh,24px);color:#B5604A}
@media (orientation:landscape) and (min-width:600px) and (max-height:600px){
  .sky{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);grid-template-rows:minmax(0,1fr)}
  .rb{grid-row:1}
  .kstar{width:clamp(30px,min(7vw,13dvh),80px)}
  .kstar.empty{height:clamp(30px,min(7vw,13dvh),80px)}
}

/* ===== cookies: 5 per row, rows start on the left (ten-frame style) ===== */
.plate,.jar{display:grid;grid-template-columns:repeat(5,minmax(0,var(--ck)));grid-auto-rows:auto;justify-content:center;align-content:center;justify-items:start}
.plate .cookie,.jar .cookie,.jar .slot{width:100%;height:auto;aspect-ratio:1/1;max-width:var(--ck)}

/* ===== round white plate + blue tray squares ===== */
.center{display:flex;align-items:center;justify-content:center;container-type:size}
.plate{flex:none;width:100%;max-width:100%;max-height:100%;aspect-ratio:1/1;
  width:min(100cqw,100cqh);height:min(100cqw,100cqh);
  border-radius:50%;background:#FFFFFF;border:4px solid #E3D6CB;
  box-shadow:inset 0 0 0 clamp(8px,3.2cqmin,18px) #F7F1EB, inset 0 0 0 calc(clamp(8px,3.2cqmin,18px) + 4px) #EADFD5, 0 6px 0 #E3D6CB;
  padding:calc(min(100cqw,100cqh) * .15);grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(4px,1.8cqmin,12px)}
.plate .cookie{max-width:none}
.plate.hot{background:#FFF8F2}
.jar{grid-template-columns:repeat(5,minmax(0,calc(var(--ck) + 14px)));gap:clamp(4px,1dvh,8px)}
.cell{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1/1;border-radius:16px;background:rgba(255,255,255,.6);border:4px solid var(--blue-slot);padding:2px}
.jar .cell .cookie{width:100%;max-width:var(--ck)}

/* ===== table: plate in the middle, loose cookies scattered around it ===== */
.stage{display:flex;flex-direction:column;gap:clamp(6px,1.4dvh,14px)}
.left{width:auto;flex:none;align-items:center}
.momo-row{flex-direction:row}
.tablewrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(4px,1dvh,10px)}
.table{position:relative;flex:1;min-height:0}
.table .plate{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:var(--pd,240px);height:var(--pd,240px);max-width:none;max-height:none;padding:calc(var(--pd,240px) * .15);
  box-shadow:inset 0 0 0 calc(var(--pd,240px) * .045) #F7F1EB, inset 0 0 0 calc(var(--pd,240px) * .045 + 4px) #EADFD5, 0 6px 0 #E3D6CB}
.loose{position:absolute;inset:0;pointer-events:none}
.loose .cookie{position:absolute;pointer-events:auto;width:var(--ck);height:var(--ck);touch-action:none;cursor:grab}
.donerow{display:flex;justify-content:flex-end;flex:none}
.donebtn{width:auto;min-width:clamp(130px,28vw,220px);min-height:clamp(52px,8dvh,80px);padding:0 28px}
:root{--ck:clamp(40px,min(11vw,7dvh),68px)}
/* phones held sideways: unicorn + sum on the left, table on the right */
@media (orientation:landscape) and (min-width:600px) and (max-height:600px){
  .stage{flex-direction:row}
  .left{width:30%;justify-content:center}
  .momo-row{flex-direction:column}
  :root{--ck:clamp(36px,10dvh,52px)}
}

/* ===== picture cookies (red = already on the plate, blue = added) ===== */
.cookie{border:0;background:var(--face) center / 100% 100% no-repeat;filter:drop-shadow(0 2px 1px rgba(90,62,51,.18))}
.cookie.counted{background:var(--dough);border:4px solid var(--edge-c);filter:none}
.cookie.ghost{filter:drop-shadow(0 10px 12px rgba(90,62,51,.3))}

/* ===== icons: fixed sizes (iPad Safari shrank %-sized svgs inside buttons) ===== */
.round svg{width:clamp(24px,4.4dvh,32px);height:clamp(24px,4.4dvh,32px);flex:none}
.round .ic-say{display:flex;align-items:center;justify-content:center}
@media (min-width:700px) and (min-height:600px){
  .round{width:60px;height:60px}
  .round svg{width:30px;height:30px}
  .small-round{width:56px;height:56px}
}
/* ===== your rainbow page ===== */
.sky{grid-template-rows:minmax(0,1fr) auto auto}
.rb .rainbow{width:100%;height:100%;max-height:420px;overflow:visible}
.bookbtn{justify-self:center;position:relative;display:flex;align-items:center;justify-content:center;width:clamp(64px,10dvh,84px);height:clamp(64px,10dvh,84px);border-radius:24px;border:4px solid #B3D5D7;background:#FFFCF7;box-shadow:0 6px 0 #B3D5D7;cursor:pointer}
.bookbtn svg{width:60%;height:60%}
.bookbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #B3D5D7}
.bookcount{position:absolute;top:-10px;right:-10px;min-width:28px;height:28px;padding:0 6px;border-radius:14px;background:#E9917A;color:#3E2A22;border:3px solid #FFFCF7;font-family:var(--display);font-weight:800;font-size:16px;line-height:22px;text-align:center;box-sizing:border-box}
@media (orientation:landscape) and (min-width:600px) and (max-height:600px){
  .sky{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);grid-template-rows:minmax(0,1fr) auto}
  .rb{grid-row:1 / 3}
  .bookbtn{grid-column:2}
}
/* ===== sticker book ===== */
body.bookbg,body.bookbg #app{background:#F3E9DC}
.book-title{font-size:clamp(22px,min(6vw,4.6dvh),40px);text-align:center;flex:1}
.book{flex:1;min-height:0;background:#FFFCF7;border:4px solid #E6D5C4;border-radius:24px;box-shadow:0 6px 0 #E6D5C4;padding:clamp(10px,2.4dvh,24px);display:flex;flex-direction:column;gap:10px;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom, transparent 0 39px, #F3E6D6 39px 41px)}
.book-empty{margin:0;text-align:center;font-weight:800;font-size:clamp(16px,2.6dvh,20px);color:var(--ink2)}
.book-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:clamp(6px,1.4dvh,14px);align-items:center;justify-items:center}
.sticker{border:0;background:none;padding:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;transform:rotate(var(--rot));cursor:pointer}
.stk{width:88%;height:88%;overflow:visible;
  filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 4px 4px rgba(90,62,51,.22))}
.sticker.wiggle{animation:wiggle .5s ease-in-out}
@keyframes wiggle{25%{transform:rotate(calc(var(--rot) - 10deg)) scale(1.08)}75%{transform:rotate(calc(var(--rot) + 8deg)) scale(1.08)}}
.sticker-slot{width:70%;aspect-ratio:1/1;max-height:90%;border:4px dashed #E6D5C4;border-radius:24px}
.reward .stk{width:auto;height:clamp(64px,22dvh,220px)}
@media (orientation:landscape){ .book-grid{grid-template-columns:repeat(7,minmax(0,1fr))} }

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* ===== speech bubbles: the ask always stays; a second bubble gives feedback ===== */
.momo-row{width:100%}
.bubbles{flex:1 1 auto;min-width:0;max-width:440px;display:flex;flex-direction:column;align-items:stretch;gap:clamp(4px,1dvh,8px)}
.bubbles .bubble{max-width:none;width:100%}
.bubbles .bubble b{white-space:nowrap}
.bubble2{padding-top:clamp(2px,.6dvh,6px)!important;padding-bottom:clamp(2px,.6dvh,6px)!important;background:#FBE3DC;border-color:#E9A796;visibility:hidden;transform:scale(.8);opacity:0;transition:transform .2s,opacity .2s}
.bubble2 b{font-size:clamp(17px,min(5vw,3.4dvh),28px)!important;color:#A44A35}
.bubble2.on{visibility:visible;transform:none;opacity:1}
.bubble2.yum{background:#E3F1DA;border-color:#A9CB97}
.bubble2.yum b{color:#4F7A3B}
/* ===== mute toggle ===== */
.round .ic-off{display:none}
body.muted .speakbtn .ic-say{display:none}
body.muted .speakbtn .ic-off{display:flex;align-items:center;justify-content:center}
body.muted .speakbtn{background:#F3E9E2}

/* ===== bubbles centred on the same axis as the sum; unicorn sits just to their left ===== */
.momo-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;column-gap:clamp(6px,1.6vw,16px);align-self:stretch;width:100%}
.momo-row #momo{grid-column:1;justify-self:end;min-width:0;max-width:100%;display:flex;justify-content:flex-end}
.momo-row .momo{max-width:100%;object-fit:contain;object-position:right center}
.momo-row .bubbles{grid-column:2;width:max-content;min-width:min(400px,46vw);max-width:none;flex:none}
@media (max-width:520px){ .momo-row .bubbles .bubble b{font-size:clamp(18px,6vw,26px)} .momo-row .bubbles{min-width:44vw} }
@media (orientation:landscape) and (min-width:600px) and (max-height:600px){
  .momo-row{display:flex;flex-direction:column}
  .momo-row #momo{justify-content:center}
  .momo-row .bubbles{width:100%;min-width:0}

.table.counting .loose .cookie{filter:grayscale(1);opacity:.45;transition:filter .25s,opacity .25s;cursor:default}
.table .loose .cookie{transition:filter .25s,opacity .25s}

  unicode-range:U+2E80-2FDF,U+3000-303F,U+3040-30FF,U+3100-312F,U+3190-31FF,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FE30-FE4F,U+FF00-FFEF}

.bar-spacer{visibility:hidden}
.bookbtn{width:clamp(52px,8dvh,60px);height:clamp(52px,8dvh,60px)}
.chip{max-height:60px}
/* ===== Ten Frame ===== */
.tile.ten{background:#FBEFC4;border-color:#EBD58F;box-shadow:0 7px 0 #EBD58F}
.soon.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.ten .momo-row .chick{height:clamp(60px,15dvh,170px);width:auto;max-width:100%;object-fit:contain;object-position:right center}
.ten .qbox{min-width:1.4em;text-align:center;color:#3E7FB0;border:4px dashed #9CC6E3;border-radius:16px;padding:0 .15em;line-height:1.1}
.ten .qbox.solved{border-style:solid;background:#EAF4FB;animation:pop .35s}
.tf-area{flex:1;min-height:0;container-type:size;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4cqh,28px);
  --cell:min(calc((100cqw - 28px) / 5.3), calc(100cqh / 4.3), 104px)}
.tf-area:has(.carton.five){--cell:min(calc((100cqw - 28px) / 5.3), calc(100cqh / 3.2), 110px)}
.carton{position:relative;display:grid;grid-template-columns:repeat(5,var(--cell));grid-auto-rows:var(--cell);gap:0;padding:calc(var(--cell) * .1);
  background:#E6D6BE;border:4px solid #CDB794;border-radius:calc(var(--cell) * .28);box-shadow:0 6px 0 #CDB794;transition:background .2s}
.carton.hot{background:#EFE2CD}
/* each cup: a round moulded hollow */
.carton .cell{background:none;border:0;border-radius:0;aspect-ratio:auto;width:auto;margin:0;position:relative;display:flex;align-items:flex-end;justify-content:center;padding-bottom:calc(var(--cell) * .08)}
.carton .cell::before{content:'';position:absolute;left:9%;top:9%;right:9%;bottom:9%;border-radius:50%;background:#D5C0A0;box-shadow:inset 0 calc(var(--cell) * .06) 0 #C4AB85}
.carton .cell > *{position:relative;z-index:1}
/* little cones between the cups */
.carton .post{position:absolute;z-index:0;width:calc(var(--cell) * .2);height:calc(var(--cell) * .2);margin:calc(var(--cell) * -.1) 0 0 calc(var(--cell) * -.1);border-radius:50%;
  background:#EFE3D0;border:2px solid #CDB794}
.egg{position:relative;display:inline-flex;align-items:center;justify-content:center;width:calc(var(--cell) * .66);height:calc(var(--cell) * .8);padding:0;border:0;background:none;
  touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;filter:drop-shadow(0 3px 2px rgba(90,62,51,.22))}
.egg .egg-svg{width:100%;height:100%;display:block;pointer-events:none}
.egg.start{cursor:default}
.egg.pop{animation:egghop .32s ease-out}
@keyframes egghop{0%{transform:translateY(-30%) scale(.7)}60%{transform:translateY(4%) scale(1.06)}100%{transform:none}}
.egg .num{position:absolute;inset:18% 0 0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:calc(var(--cell) * .4);color:#1F4F73;text-shadow:0 0 6px #fff,0 0 3px #fff}

var G = null;
var ROUND = 5;
function factKey(s, a){ return s + '+' + a; }
function factState(s, a){
  var f = S.facts[factKey(s, a)];
  if (!f || !f.t) return 'new';
  if (f.r >= 2 && f.r / f.t >= 0.75) return 'got';
  return 'learn';
}
function allFacts(max){
  var out = [];
  for (var t = 2; t <= max; t++) for (var s = 1; s < t; s++) out.push([s, t - s]);
  return out;
}
function pickFact(){
  var list = allFacts(S.maxSum).filter(function(p){ return S.maxSum <= 10 || p[1] <= 9; }), bag = [];
  list.forEach(function(p){
    var st = factState(p[0], p[1]);
    var w = st === 'got' ? 1 : st === 'learn' ? 4 : 3;
    if (G && G.last === factKey(p[0], p[1])) w = 0;
    for (var i = 0; i < w; i++) bag.push(p);
  });
  return bag[Math.floor(Math.random() * bag.length)] || [2, 3];
}
function startRound(){ G = { q:0, earned:0, startStars:S.stars }; newQuestion(); }
function newQuestion(){
  var p = pickFact();

  G.last = factKey(G.s, G.a);
  G.added = 0; G.jarCount = S.maxSum <= 10 ? Math.min(G.a + 2, 12 - G.s) : Math.min(G.a + 2, 11); G.first = true; G.lock = false; G.mood = 'hungry';
  G.taken = []; G.stack = []; G.seed = Math.floor(Math.random() * 1e9); G.pos = null; G.faceSeed = Math.floor(Math.random() * 12);
  G.bubble2 = '';
  screen = 'play'; closeOverlay(); renderPlay();
  askAloud();
}

}

var FACES = 12;
function face(color, n){ return '--face:url(cookies/' + color + '_' + ('0' + ((((n % FACES) + FACES) % FACES) + 1)).slice(-2) + '.png)'; }
function redFace(i){ return face('red', (G ? G.faceSeed : 0) + i * 5); }
function blueFace(spot){ return face('blue', (G ? G.faceSeed : 0) + 3 + spot * 7); }
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function layoutTable(){
  var tb = document.getElementById('table'), pl = document.getElementById('plate');
  if (!tb || !pl || !G) return;
  var W = tb.clientWidth, H = tb.clientHeight;
  var probe = document.createElement('span'); probe.className = 'cookie'; probe.style.visibility = 'hidden'; tb.appendChild(probe);
  var c = probe.getBoundingClientRect().width || 44; probe.remove();
  /* plate: as big as possible while leaving a band around it for the loose cookies */
  var cap = (5 * c + 32) / 0.70;                       /* plate cookies never bigger than loose ones */
  var rand, pos, cx = W / 2, cy = H / 2, R;
  function ok(x, y, g){
    var mx = x + c / 2, my = y + c / 2;
    if (Math.hypot(mx - cx, my - cy) < R + c / 2) return false;
    for (var i = 0; i < pos.length; i++) if (Math.hypot(pos[i][0] - x, pos[i][1] - y) < c + g) return false;
    return true;
  }
  function place(D, g, force){
    R = D / 2 + 8; rand = rng(G.seed); pos = [];

      var got = null;

        var x = 4 + rand() * Math.max(1, W - c - 8), y = 4 + rand() * Math.max(1, H - c - 8);
        if (ok(x, y, g)) got = [Math.round(x), Math.round(y)];
      }
      if (!got) { if (!force) return false; got = [Math.round(4 + rand() * (W - c - 8)), Math.round(k % 2 ? 4 : H - c - 4)]; }

  tb.style.setProperty('--pd', D + 'px');

  var rows = Math.ceil((G.s + G.jarCount) / 5);

  else tb.style.removeProperty('--pcol');

}
window.addEventListener('resize', function(){ if (screen === 'play') layoutTable(); });
function setMomo(mood, anim){

function addCookie(spot){

  if (spot === undefined || spot === null || isNaN(spot) || G.taken[spot]) { spot = 0; while (G.taken[spot]) spot++; }
  G.taken[spot] = true; G.stack.push(spot); G.added = G.stack.length;

}
function removeCookie(){

}
function record(right){
  var k = factKey(G.s, G.a);

/* cookies fly from the plate into the unicorn's mouth; returns total ms */
var reduceMotion = false;
try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e) {}
function feedUnicorn(){
  var cs = Array.prototype.slice.call(document.querySelectorAll('#plate .cookie'));
  var m = document.querySelector('#momo .momo');
  if (!cs.length || !m) return 0;
  var gentle = reduceMotion;                       /* Reduce Motion: still fly, but straight and without spinning */
  var mr = m.getBoundingClientRect();
  var tx = mr.left + mr.width * 0.64, ty = mr.top + mr.height * 0.6;   /* mouth (unicorn faces right) */
  var STAGGER = 200, FLY = 650;
  cs.forEach(function(c, i){
    var r = c.getBoundingClientRect();
    var fly = document.createElement('span');
    fly.className = c.className.replace(/\b(pop|counted)\b/g, '') + ' flying';
    var fc = c.style.getPropertyValue('--face');
    fly.style.cssText = (fc ? '--face:' + fc + ';' : '') + 'position:fixed;left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px;margin:0;z-index:30;pointer-events:none';
    var dx = tx - (r.left + r.width / 2), dy = ty - (r.top + r.height / 2);
    var lift = Math.min(160, 60 + Math.abs(dx) * 0.25);
    setTimeout(function(){
      document.body.appendChild(fly);
      c.style.visibility = 'hidden';
      var landed = false;
      function land(){
        if (landed) return; landed = true;
        fly.remove();
        var mm = document.querySelector('#momo .momo');
        try { if (mm && mm.animate) mm.animate([{ transform:'scale(1)' }, { transform:'scale(1.07,.93)' }, { transform:'scale(1)' }], { duration: 220 }); } catch(e) {}
      }
      var rot = gentle ? 0 : 1, l2 = gentle ? 0 : lift;
      /* every keyframe lists every property: older Safari rejects "partial" keyframes */
      var frames = [
        { transform: 'translate(0px,0px) scale(1) rotate(0deg)', opacity: 1, offset: 0 },
        { transform: 'translate(' + dx * 0.5 + 'px,' + (dy * 0.5 - l2) + 'px) scale(.85) rotate(' + 160 * rot + 'deg)', opacity: 1, offset: 0.5 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.15) rotate(' + 320 * rot + 'deg)', opacity: 0.6, offset: 1 }
      ];
      var ok = false;
      try {
        if (fly.animate) { var a = fly.animate(frames, { duration: FLY, easing: 'ease-in-out', fill: 'forwards' }); a.onfinish = land; ok = true; }
      } catch(e) { ok = false; }

    }, i * STAGGER);
  });

}

  if (ptab === 'progress') {
    body = '<div class="card gridcard"><div class="head"><h2>' + L('facts') + '</h2><span class="stat">' + L('stat', S.stars, got, list.length) + '</span></div>' +
      '<div class="legend"><span><i class="f-got"></i>' + L('gotIt') + '</span><span><i class="f-learn"></i>' + L('learning') + '</span><span><i class="f-new"></i>' + L('notTried') + '</span></div>' +
      '<div class="facts-wrap"><div class="facts' + (cols > 9 ? ' many' : '') + '" style="grid-template-columns:repeat(' + (cols + 1) + ',minmax(0,1fr));grid-template-rows:repeat(' + (cols + 1) + ',minmax(0,1fr))">' + grid + '</div></div></div>' +
      '<div class="card tipcard"><h2>' + L('tryHome') + '</h2><p class="tip">' + tip + '</p>' + suggest +
      '<p class="tip small">' + L('caption') + '</p></div>';
  } else {
    body = '<div class="card settings">' +
      '<div class="field"><span class="lab">' + L('language') + '</span>' + langPicker() +
        (hasSpeech && !hasVoice(S.lang) ? '<span class="tip small">' + L('noVoice', L('langName')[S.lang]) + '</span>' : '') + '</div>' +
      '<div class="field"><label for="nameInput" class="lab">' + L('childName') + '</label><input id="nameInput" type="text" maxlength="20" placeholder="' + esc(L('shownHome')) + '" value="' + esc(S.name) + '"></div>' +
      '<div class="field"><span class="lab">' + L('biggest') + '</span><div class="seg"><button data-act="max" data-v="5" aria-pressed="' + (max === 5) + '">' + L('upTo', 5) + '</button><button data-act="max" data-v="10" aria-pressed="' + (max === 10) + '">' + L('upTo', 10) + '</button><button data-act="max" data-v="15" aria-pressed="' + (max === 15) + '">' + L('upTo', 15) + '</button><button data-act="max" data-v="20" aria-pressed="' + (max === 20) + '">' + L('upTo', 20) + '</button></div></div>' +
      '<div class="field"><span class="lab">' + L('spoken') + '</span><div class="seg"><button data-act="voice" data-v="1" aria-pressed="' + S.voice + '">' + L('on') + '</button><button data-act="voice" data-v="0" aria-pressed="' + !S.voice + '">' + L('off') + '</button></div>' +
        (hasSpeech ? '' : '<span class="tip small">' + L('noSpeech') + '</span>') + '</div>' +
      (hasSpeech ? (function(){
        /* only the kinds of voice this device actually has for this language can be picked */
        var okF = hasVoiceType(S.lang, 'female'), okM = hasVoiceType(S.lang, 'male');
        var cur = S.voiceType === 'male' ? (okM || !okF ? 'male' : 'female') : (okF || !okM ? 'female' : 'male');
        return '<div class="field"><span class="lab">' + L('voiceType') + '</span><div class="seg">' +
          '<button data-act="vtype" data-v="female" aria-pressed="' + (cur === 'female') + '"' + (okF ? '' : ' disabled') + '>' + L('female') + '</button>' +
          '<button data-act="vtype" data-v="male" aria-pressed="' + (cur === 'male') + '"' + (okM ? '' : ' disabled') + '>' + L('male') + '</button></div></div>';
      })() : '') +
      '<div class="field"><span class="lab">' + L('progressLab') + '</span><button class="link-btn" style="text-align:left" data-act="reset">' + (resetArmed ? L('resetConfirm') : L('reset')) + '</button>' +
        '<span class="tip small" style="margin:0">' + L('savedHere') + '</span></div>' +
    '</div>';
  }
  app.innerHTML = '<section class="screen parents">' +
    '<div class="bar"><div><div class="eyebrow">' + L('grownUps') + '</div><h1>' + esc(L('progressOf', S.name)) + '</h1></div>' +
    '<button class="big-btn plain back-kid" data-act="home">' + L('backKid') + '</button></div>' +
    '<div class="tabs" role="tablist"><button role="tab" data-act="ptab" data-v="progress" aria-selected="' + (ptab === 'progress') + '">' + L('tabProgress') + '</button><button role="tab" data-act="ptab" data-v="settings" aria-selected="' + (ptab === 'settings') + '">' + L('tabSettings') + '</button></div>' +
    '<div class="pbody">' + body + '</div></section>';
  var inp = document.getElementById('nameInput');
  if (inp) inp.addEventListener('input', function(){ S.name = inp.value.trim(); save(); });
}

/* ---------- actions ---------- */
document.addEventListener('click', function(e){
  var jarC = e.target.closest('#jar .cookie');
  if (jarC && e.detail === 0) { addCookie(+jarC.getAttribute('data-spot')); return; } /* keyboard */
  var rd = e.target.closest('.busgame .rider[data-rider]');
  if (rd && e.detail === 0) { busBoard(+rd.getAttribute('data-rider')); return; }
  var eg = e.target.closest('.ten .egg[data-spare], .ten .egg[data-cell]');
  if (eg && e.detail === 0) { if (eg.hasAttribute('data-spare')) tenPut(+eg.getAttribute('data-spare')); else tenTake(+eg.getAttribute('data-cell')); return; }
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act');
  /* the speaker button is a mute toggle: tap to mute, tap again to unmute (and hear the line) */
  if (b.classList.contains('speakbtn')) {
    S.voice = !S.voice; save(); syncMute();
    if (!S.voice) { clearSay(); return; }
  }
  switch (act) {
    case 'name-say': say(S.name && !askName ? L('sIsThatYou', S.name) : L('sAskName')); break;
    case 'its-me': show('home'); break;
    case 'not-me': askName = true; renderStart(); var ki = document.getElementById('kidName'); if (ki) ki.focus(); break;
    case 'skip-name': askName = false; show('home'); break;
    case 'hello': say(L('sHello', S.name)); break;
    case 'lang': setLang(b.getAttribute('data-v')); break;
    case 'play': startRound(); break;
    case 'ten': startTen(); break;
    case 'bus': startBus(); break;
    case 'avatar': avatarReturn = screen === 'start' ? 'start' : 'home'; show('avatar'); break;
    case 'pick-avatar':
      S.avatar = b.getAttribute('data-v'); S.avatarPicked = true; save();
      document.querySelectorAll('.av-opt').forEach(function(x){ x.setAttribute('aria-checked', String(x === b)); });
      b.classList.remove('picked'); void b.offsetWidth; b.classList.add('picked');
      break;
    case 'avatar-done': show(avatarReturn === 'start' ? 'start' : 'home'); break;
    case 'bus-repeat': busAskAloud(); break;
    case 'bus-pick': busPick(+b.getAttribute('data-v')); break;
    case 'ten-repeat': tenAskAloud(); break;
    case 'tf-pick': tenPick(+b.getAttribute('data-v')); break;
    case 'home': show('home'); break;
    case 'garden': show('garden'); break;
    case 'book': show('book'); break;
    case 'sticker': b.classList.remove('wiggle'); void b.offsetWidth; b.classList.add('wiggle'); break;
    case 'garden-say':
      var nR = rainbowProgress(S.stars).done.length, left = PER_STRIPE - S.stars % PER_STRIPE;
      say(S.stars ? L('sGarden', S.stars).concat(nR ? [L('sRainbows', nR)] : []).concat([L('sSun', left)]) : L('sGarden', 0)); break;
    case 'soon': say(L('sSoon', L(b.getAttribute('data-g')))); break;
    case 'repeat': askAloud(); break;
    case 'remove': if (e.detail === 0) removeCookie(); break; /* keyboard; pointer taps handled above */
    case 'check': check(); break;
    case 'next': next(); break;
    case 'again': if (G && G.game === 'ten') startTen(); else if (G && G.game === 'bus') startBus(); else startRound(); break;
    case 'gate': gate(); break;
    case 'close': closeOverlay(); break;
    case 'gate-ans': if (b.getAttribute('data-ok') === '1') { resetArmed = false; ptab = 'progress'; show('parents'); } else closeOverlay(); break;
    case 'ptab': ptab = b.getAttribute('data-v'); resetArmed = false; renderParents(); break;
    case 'max': S.maxSum = +b.getAttribute('data-v'); save(); renderParents(); break;
    case 'vtype': S.voiceType = b.getAttribute('data-v'); save(); renderParents(); say(L('sSample')); break;
    case 'voice': S.voice = b.getAttribute('data-v') === '1'; save(); syncMute(); renderParents(); if (S.voice) say(L('sVoiceOn')); break;
    case 'reset':
      if (!resetArmed) { resetArmed = true; renderParents(); }
      else { resetArmed = false; var keep = { name:S.name, voice:S.voice, maxSum:S.maxSum, lang:S.lang }; S = load(); S.stars = 0; S.facts = {}; S.name = keep.name; S.voice = keep.voice; S.maxSum = keep.maxSum; S.lang = keep.lang; save(); renderParents(); }
      break;
  }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && document.querySelector('.overlay .gate')) closeOverlay(); });

render();
})();
</script>
</body>
</html>
