    '<div class="book">' + (done.length ? '' : '<p class="book-empty">' + L('noStickers') + '</p>') + '<div class="book-grid">' + slots + '</div></div>' +
    '</section>';
}

/* ---------- parental gate ---------- */
function gate(){
  var a = 6 + Math.floor(Math.random() * 4), b = 3 + Math.floor(Math.random() * 4), ans = a * b;
  var opts = [ans, ans + a, ans - b, ans + 2].sort(function(){ return Math.random() - .5; });
  overlay('<div class="gate"><h2>' + L('grownOnly') + '</h2><p>' + L('whatIs', a, b) + '</p>' +
    '<div class="opts">' + opts.map(function(o){ return '<button data-act="gate-ans" data-ok="' + (o === ans ? 1 : 0) + '">' + o + '</button>'; }).join('') + '</div>' +
    '<button class="link-btn" data-act="close">' + L('cancel') + '</button></div>');
}

/* ---------- parent view ---------- */
var resetArmed = false, ptab = 'progress';
/* add a child (id null) or edit one: name, buddy, delete */
function kidDialog(id){
  var k = null; if (id) for (var i = 0; i < S.kids.length; i++) if (S.kids[i].id === id) k = S.kids[i];
  var o = overlay('<form class="gate kid-dialog" id="kidForm" autocomplete="off"><h2>' + (k ? L('editKid', k.name || '') : L('addKid')) + '</h2>' +
    '<label class="lab" for="kidDlgName">' + L('childName') + '</label>' +
    '<input id="kidDlgName" class="kid-name" type="text" maxlength="20" spellcheck="false" autocapitalize="words" value="' + esc(k ? k.name : '') + '" placeholder="' + esc(L('typeName')) + '">' +
    '<div class="row two"><button type="button" class="big-btn plain back-kid" data-act="close">' + L('cancel') + '</button><button type="submit" class="big-btn back-kid">' + (k ? L('saveBtn') : L('nextStep')) + '</button></div>' +
    (k && S.kids.length > 1 ? '<button type="button" class="link-btn kid-del" data-act="kid-del" data-v="' + k.id + '">' + L('deleteKid') + '</button>' : '') +
    '</form>');
  var inp = document.getElementById('kidDlgName'); if (inp) setTimeout(function(){ inp.focus(); }, 50);
  document.getElementById('kidForm').addEventListener('submit', function(e){
    e.preventDefault();
    var v = inp.value.trim().slice(0, 20); if (!v) { inp.focus(); return; }
    if (k) { k.name = v; if (k.id === S.active) S.name = v; save(); closeOverlay(); renderParents(); }
    else { addKid(v); closeOverlay(); avatarReturn = 'parents'; show('avatar'); }   /* new child: pick their buddy next */
  });
}
function renderParents(){
  var oldSc = document.querySelector('.screen.parents'), keepY = oldSc ? oldSc.scrollTop : 0;   /* re-rendering after a tap keeps the scroll position */
  var max = BIG(), list = allFacts(MX()), got = 0;
  list.forEach(function(p){ if (factState(p[0], p[1]) === 'got') got++; });
  var cols = MX() - 1;
  var grid = '<div class="h"></div>';
  for (var c = 1; c <= cols; c++) grid += '<div class="h">+' + c + '</div>';
  for (var s = 1; s <= cols; s++) {
    grid += '<div class="h">' + s + '</div>';
    for (var a = 1; a <= cols; a++) {
      if (s + a > max) grid += '<div class="f-x"></div>';
      else { var st = factState(s, a); grid += '<div class="f-' + st + '" title="' + s + ' + ' + a + '">' + s + '+' + a + '</div>'; }
    }
  }
  var close = list.filter(function(p){ return factState(p[0], p[1]) === 'learn'; }).slice(0, 2);
  var tip = close.length
    ? L('tipClose', close.map(function(p){ return p[0] + ' + ' + p[1]; }).join(L('and')), close[0][0], close[0][1])
    : L('tipDefault');
  var suggest = (max === 5 && got >= 8) ? '<p class="tip" style="margin-top:8px">' + L('ready') + '</p>' : '';
  var body;
  /* children row: every child as a pill; the one playing now is outlined and has the pencil */
  var kidRow = '<div class="kidrow"><div class="kidscroll">' + S.kids.map(function(k){
    var on = k.id === S.active;
    return '<div class="kpill' + (on ? ' on' : '') + '">' +
      '<button class="kp-main" data-act="kid-use" data-v="' + k.id + '" aria-pressed="' + on + '">' +
        '<span class="kp-av">' + avatarFace(k.avatarPicked ? k.avatar : 'av17') + '</span><b>' + esc(k.name || '—') + '</b></button>' +
      (on ? '<button class="kp-edit" data-act="kid-edit" data-v="' + k.id + '" aria-label="' + esc(L('editKid', k.name || '')) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg></button>' : '') +
    '</div>';
  }).join('') + '<button class="kp-add" data-act="kid-add" aria-label="' + esc(L('addKid')) + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div></div>';
  if (ptab !== 'settings') ptab = 'progress';
  if (ptab === 'progress') {
    var skills = '';
    if (isBig()) {
      var SK = [['tens', 'skTens', '20 + 30'], ['tensones', 'skTensOnes', '34 + 20'], ['addten', 'skAddTen', '34 + 10'], ['addones', 'skAddOnes', '34 + 5'], ['cross', 'skCross', '38 + 5']];
      skills = '<div class="card skillcard"><div class="head"><h2>' + L('skTitle') + '</h2></div>' +
        '<div class="legend"><span><i class="f-got"></i>' + L('gotIt') + '</span><span><i class="f-learn"></i>' + L('learning') + '</span><span><i class="f-new"></i>' + L('notTried') + '</span></div>' +
        '<ul class="skills">' + SK.map(function(k){
          var f = S.facts['T:' + k[0]] || { t: 0, r: 0 }, st = !f.t ? 'new' : (f.r >= 2 && f.r / f.t >= 0.75 ? 'got' : 'learn');
          return '<li><span class="sk-t f-' + st + '">' + (f.t ? f.r + '/' + f.t : '') + '</span><span class="sk-n"><b>' + L(k[1]) + '</b><small>' + k[2] + '</small></span></li>';
        }).join('') + '</ul></div>';
    }
    body = skills + '<div class="card gridcard"><div class="head"><h2>' + L('facts') + '</h2><span class="stat">' + L('stat', S.stars, got, list.length) + '</span></div>' +
      '<div class="legend"><span><i class="f-got"></i>' + L('gotIt') + '</span><span><i class="f-learn"></i>' + L('learning') + '</span><span><i class="f-new"></i>' + L('notTried') + '</span></div>' +
      '<div class="facts-wrap"><div class="facts' + (cols > 9 ? ' many' : '') + '" style="grid-template-columns:repeat(' + (cols + 1) + ',minmax(0,1fr));grid-template-rows:repeat(' + (cols + 1) + ',minmax(0,1fr));--fmax:' + Math.min(560, (cols + 1) * 62) + 'px">' + grid + '</div></div></div>' +
      '<div class="card tipcard"><h2>' + L('tryHome') + '</h2><p class="tip">' + tip + '</p>' + suggest +
      '<p class="tip small">' + L('caption') + '</p></div>';
  } else {
    body = '<div class="setgrid"><div class="card settings">' +
      '<div class="field"><span class="lab">' + L('language') + '</span>' + langPicker() +
        (hasSpeech && !hasVoice(S.lang) ? '<span class="tip small">' + L('noVoice', L('langName')[S.lang]) + '</span>' : '') + '</div></div>' +
      '<div class="card settings"><div class="field"><span class="lab">' + L('biggest') + '</span><div class="seg seg6"><button data-act="max" data-v="5" aria-pressed="' + (max === 5) + '">' + L('upTo', 5) + '</button><button data-act="max" data-v="10" aria-pressed="' + (max === 10) + '">' + L('upTo', 10) + '</button><button data-act="max" data-v="15" aria-pressed="' + (max === 15) + '">' + L('upTo', 15) + '</button><button data-act="max" data-v="20" aria-pressed="' + (max === 20) + '">' + L('upTo', 20) + '</button><button data-act="max" data-v="50" aria-pressed="' + (max === 50) + '">' + L('upTo', 50) + '</button><button data-act="max" data-v="100" aria-pressed="' + (max === 100) + '">' + L('upTo', 100) + '</button></div></div>' +
      '</div><div class="card settings"><div class="field"><span class="lab">' + L('spoken') + '</span><div class="seg"><button data-act="voice" data-v="1" aria-pressed="' + S.voice + '">' + L('on') + '</button><button data-act="voice" data-v="0" aria-pressed="' + !S.voice + '">' + L('off') + '</button></div>' +
        (hasSpeech ? '' : '<span class="tip small">' + L('noSpeech') + '</span>') + '</div>' +
      (hasSpeech ? (function(){
        /* only the kinds of voice this device actually has for this language can be picked */
        var okF = hasVoiceType(S.lang, 'female'), okM = hasVoiceType(S.lang, 'male');
        var cur = S.voiceType === 'male' ? (okM || !okF ? 'male' : 'female') : (okF || !okM ? 'female' : 'male');
        return '<div class="field' + (S.voice ? '' : ' off') + '"><span class="lab">' + L('voiceType') + '</span><div class="seg">' +
          '<button data-act="vtype" data-v="female" aria-pressed="' + (cur === 'female') + '"' + (okF && S.voice ? '' : ' disabled') + '>' + L('female') + '</button>' +
          '<button data-act="vtype" data-v="male" aria-pressed="' + (cur === 'male') + '"' + (okM && S.voice ? '' : ' disabled') + '>' + L('male') + '</button></div></div>' +
          '<div class="field' + (S.voice ? '' : ' off') + '"><span class="lab">' + L('speed') + '</span><div class="seg">' +
          ['slow', 'medium', 'fast'].map(function(r){ return '<button data-act="vrate" data-v="' + r + '" aria-pressed="' + ((S.voiceRate || 'medium') === r) + '"' + (S.voice ? '' : ' disabled') + '>' + L('rate_' + r) + '</button>'; }).join('') + '</div></div>';
      })() : '') +
      '</div><div class="card settings"><div class="field"><span class="lab">' + L('progressLab') + '</span><button class="link-btn" style="text-align:left" data-act="reset">' + (resetArmed ? L('resetConfirm', L('stars', S.stars), L('stickersN', rainbowProgress(S.stars).done.length)) : L('reset')) + '</button>' +
        '<span class="tip small" style="margin:0">' + L('savedHere') + '</span></div>' +
    '</div></div>';
  }
  app.innerHTML = '<section class="screen parents">' +
    '<div class="bar"><div><h1>' + L('grownUps') + '</h1></div>' +
    '<button class="big-btn plain back-kid" data-act="home">' + L('backKid') + '</button></div>' +
    kidRow +
    '<div class="utabs" role="tablist"><button role="tab" data-act="ptab" data-v="progress" aria-selected="' + (ptab === 'progress') + '">' + L('tabProgress') + '</button><button role="tab" data-act="ptab" data-v="settings" aria-selected="' + (ptab === 'settings') + '">' + L('tabSettings') + '</button></div>' +
    '<div class="pbody">' + body + '</div></section>';
  var inp = document.getElementById('nameInput');
  if (inp) inp.addEventListener('input', function(){ S.name = inp.value.trim(); save(); });
  if (keepY) { var sc = document.querySelector('.screen.parents'); if (sc) sc.scrollTop = keepY; }
}

/* ---------- actions ---------- */
document.addEventListener('click', function(e){
  var jarC = e.target.closest('#jar .cookie');
  if (jarC && e.detail === 0) { addCookie(+jarC.getAttribute('data-spot')); return; } /* keyboard */
  var rd = e.target.closest('.busgame .rider[data-rider]');
  if (rd && e.detail === 0) { busBoard(+rd.getAttribute('data-rider')); return; }
  var eg = e.target.closest('.ten .egg[data-spare], .ten .egg[data-cell]');
  if (eg && e.detail === 0) { if (eg.hasAttribute('data-spare')) tenPut(+eg.getAttribute('data-spare')); else tenTake(+eg.getAttribute('data-cell')); return; }
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act');
  /* the speaker button is a mute toggle: tap to mute, tap again to unmute (and hear the line) */
  if (b.classList.contains('speakbtn')) {
    S.voice = !S.voice; save(); syncMute();
    if (!S.voice) { clearSay(); return; }
  }
  switch (act) {
    case 'name-say': say(S.name && !askName ? L('sIsThatYou', S.name) : L('sAskName')); break;
    case 'its-me': homeGroup = null; show('home'); break;
    case 'not-me': askName = true; renderStart(); var ki = document.getElementById('kidName'); if (ki) ki.focus(); break;
    case 'skip-name': askName = false; show('home'); break;
    case 'hello': say(L('sHello', S.name)); break;
    case 'lang': setLang(b.getAttribute('data-v')); break;
    case 'play': startRound(); break;
    case 'ten': startTen(); break;
    case 'bus': startBus(); break;
    case 'frog': startFrog(); break;
    case 'tower': startTower(); break;
    case 'croc': startCroc(); break;
    case 'train': startTrain(); break;
    case 'beads': startBeads(); break;
    case 'birds': startBirds(); break;
    case 'market': startMarket(); break;
    case 'up': startUp(); break;
    case 'up-pick': upPick(+b.getAttribute('data-v')); break;
    case 'up-repeat': say(G.asked ? P(L('upHow'), 'ask') : L('sUpAsk2')); break;
    case 'mk-bin': marketBin(b.getAttribute('data-v')); break;
    case 'mk-repeat': say(marketSay()); break;
    case 'bird-pick': birdPick(+b.getAttribute('data-v')); break;
    case 'bird-repeat': say(G.asked ? P(L('birdAsk'), 'ask') : L('sBirdStart', G.n)); break;
    case 'bead-repeat': say(L('sBeadAsk2')); break;
    case 'train-repeat': say(G && G.mode === 'drag' ? L('sTrainDrag') : L('sTrainAsk2')); break;
    case 'train-slot': trainSlot(b.getAttribute('data-v')); break;
    case 'croc-repeat': say(G && G.mode === 'num' ? L('sCrocAskNum') : L('sCrocAsk2')); break;
    case 'croc-pick': crocSelect(b.getAttribute('data-v')); break;
    case 'croc-done': crocDone(); break;
    case 'group': homeGroup = b.getAttribute('data-v'); show('home'); break;
    case 'home-top': homeGroup = null; show('home'); break;
    case 'start-switch': {
      switchKid(b.getAttribute('data-v')); renderStart();
      var av = document.querySelector('.start-av'); if (av) { av.classList.remove('pop'); void av.offsetWidth; av.classList.add('pop'); }
      var me = document.querySelector('[data-act=its-me]'); if (me) me.focus();
      break;
    }
    case 'start-add': holdGate(); break;
    case 'add-back': { var nm = pendingKid ? pendingKid.name : ''; show('start'); addStep1(nm); break; }
    case 'add-close': pendingKid = null; show('start'); break;
    case 'add-pick': if (pendingKid) { pendingKid.avatar = b.getAttribute('data-v'); renderAddBuddy(); var sb = document.querySelector('.av-opt.sel'); if (sb) sb.focus(); } break;
    case 'add-done': {
      if (!pendingKid || !pendingKid.avatar) break;
      var pk = pendingKid; pendingKid = null;
      addKid(pk.name); S.avatar = pk.avatar; S.avatarPicked = true; save(); askName = false;
      show('start');
      var av2 = document.querySelector('.start-av'); if (av2) av2.classList.add('pop');
      break;
    }
    case 'write': startWrite(); break;
    case 'write-repeat': say(L('sWriteAsk', G.s, G.a)); break;
    case 'write-clear': writeClear(); break;
    case 'write-done': writeDone(); break;
    case 'tower-repeat': towerAskAloud(); break;
    case 'tw-pick': towerPick(+b.getAttribute('data-v')); break;
    case 'frog-repeat': frogAskAloud(); break;
    case 'frog-pick': frogPick(+b.getAttribute('data-v')); break;
    case 'frog-done': frogDone(); break;
    case 'avatar': avatarReturn = screen === 'start' ? 'start' : 'home'; show('avatar'); break;
    case 'pick-avatar':
      S.avatar = b.getAttribute('data-v'); S.avatarPicked = true; save();
      document.querySelectorAll('.av-opt').forEach(function(x){ x.setAttribute('aria-checked', String(x === b)); });
      b.classList.remove('picked'); void b.offsetWidth; b.classList.add('picked');
      break;
    case 'avatar-done': if (avatarReturn === 'parents') { show('parents'); } else show(avatarReturn === 'start' ? 'start' : 'home'); break;
    case 'bus-repeat': busAskAloud(); break;
    case 'bus-pick': busPick(+b.getAttribute('data-v')); break;
    case 'ten-repeat': tenAskAloud(); break;
    case 'tf-pick': tenPick(+b.getAttribute('data-v')); break;
    case 'home': show('home'); if (screen === 'locked') say(L('sLock')); break;
    case 'garden':
      /* remember where we came from, so Back returns there (a game in progress continues with the next question) */
      var ov = document.querySelector('.overlay');
      if (screen !== 'book') gardenFrom = ov && ov.querySelector('[data-act=next]') && G ? { kind:'next', screen:screen } : { kind:'screen', screen:(ov ? 'home' : screen) };
      show('garden'); break;
    case 'garden-back':
      if (gardenFrom && gardenFrom.kind === 'next' && G) { screen = gardenFrom.screen; render(); next(); }
      else show(gardenFrom && gardenFrom.screen && gardenFrom.screen !== 'garden' ? gardenFrom.screen : 'home');
      break;
    case 'book': show('book'); break;
    case 'sticker': {
      /* show the sticker big, over the whole screen; any tap closes it */
      var art = b.querySelector('.stk'); if (!art) break;
      var zoom = document.createElement('div'); zoom.className = 'sticker-zoom'; zoom.setAttribute('role', 'dialog'); zoom.setAttribute('aria-modal', 'true');
      zoom.setAttribute('aria-label', b.getAttribute('aria-label') || '');
      var big = art.cloneNode(true); big.classList.add('zoomed'); zoom.appendChild(big);
      var from = b.getBoundingClientRect();
      zoom.addEventListener('click', function(ev){ ev.stopPropagation(); zoom.classList.add('out'); setTimeout(function(){ zoom.remove(); }, 220); });
      document.body.appendChild(zoom);
      try { big.animate([{ transform:'translate(' + (from.left + from.width / 2 - innerWidth / 2) + 'px,' + (from.top + from.height / 2 - innerHeight / 2) + 'px) scale(.2)', opacity:.6 }, { transform:'translate(0px,0px) scale(1)', opacity:1 }], { duration:280, easing:'cubic-bezier(.2,.9,.3,1.2)' }); } catch(e) {}
      break;
    }
    case 'garden-say':
      var nR = rainbowProgress(S.stars).done.length, left = PER_STRIPE - S.stars % PER_STRIPE;
      say(S.stars ? L('sGarden', S.stars).concat(nR ? [L('sRainbows', nR)] : []).concat([L('sSun', left)]) : L('sGarden', 0)); break;
    case 'soon': say(L('sSoon', L(b.getAttribute('data-g')))); break;
    case 'repeat': askAloud(); break;
    case 'remove': if (e.detail === 0) removeCookie(); break; /* keyboard; pointer taps handled above */
    case 'check': check(); break;
    case 'next': next(); break;
    case 'again': if (timeUp()) { show('home'); say(L('sLock')); break; }
      if (G && G.game === 'ten') startTen(); else if (G && G.game === 'bus') startBus(); else if (G && G.game === 'frog') startFrog(); else if (G && G.game === 'tower') startTower(); else if (G && G.game === 'croc') startCroc(); else if (G && G.game === 'train') startTrain(); else if (G && G.game === 'beads') startBeads(); else if (G && G.game === 'write') startWrite(); else if (G && G.game === 'birds') startBirds(); else if (G && G.game === 'market') startMarket(); else if (G && G.game === 'up') startUp(); else startRound(); break;
    case 'gate': gateFor = 'parents'; gate(); break;
    case 'update-now': if (newBuild) doUpdate(); break;
    case 'timer-set': startSession(+b.getAttribute('data-v')); break;
    case 'timer-none': gateFor = 'notimer'; gate(); break;
    case 'lock-grown': gateFor = 'unlock'; gate(); break;
    case 'close': closeOverlay(); break;
    case 'gate-ans':
      if (b.getAttribute('data-ok') === '1') {
        if (gateFor === 'notimer') { closeOverlay(); startSession(0); }
        else if (gateFor === 'unlock') { S.sess = null; save(); show('home'); }   /* a grown-up unlocks: choose a new timer */
        else { resetArmed = false; ptab = 'progress'; show('parents'); }
      }
      else { var gbox = b.closest('.gate'); if (gbox) { gbox.classList.remove('nope'); void gbox.offsetWidth; gbox.classList.add('nope'); } if (navigator.vibrate) try { navigator.vibrate(80); } catch(e) {} }   /* wrong: shake, stay open */
      break;
    case 'ptab': ptab = b.getAttribute('data-v'); resetArmed = false; renderParents(); break;
    case 'kid-use': switchKid(b.getAttribute('data-v')); renderParents(); break;
    case 'kid-add': kidDialog(null); break;
    case 'kid-edit': kidDialog(b.getAttribute('data-v')); break;
    case 'kid-del': {
      var kd2 = b.getAttribute('data-v');
      if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = L('deleteConfirm'); break; }
      deleteKid(kd2); closeOverlay(); renderParents(); break;
    }
    case 'max': S.maxSum = +b.getAttribute('data-v'); save(); renderParents(); break;
    case 'vtype': S.voiceType = b.getAttribute('data-v'); save(); renderParents(); say(L('sSample')); break;
    case 'vrate': S.voiceRate = b.getAttribute('data-v'); save(); renderParents(); say(L('sSample')); break;
    case 'voice': S.voice = b.getAttribute('data-v') === '1'; save(); syncMute(); renderParents(); if (S.voice) say(L('sVoiceOn')); break;
    case 'reset':
      if (!resetArmed) { resetArmed = true; renderParents(); }
      else { resetArmed = false; S.stars = 0; S.facts = {}; save(); renderParents(); }   /* only the active child's progress */
      break;
  }
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && document.querySelector('.overlay .gate')) closeOverlay(); });

render();
})();
</script>
